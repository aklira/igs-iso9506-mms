#
# Interop bench. The reference peer runs as separate containers and is used as a black box only
# (IMPLEMENTATION.md, rule 1). Fixed addresses: the client is given the server address.

x-peer: &peer
  image: localhost/igsmms-peer:v1.6.2.1
  build:
    context: ./peer

services:
  ref-server:
    <<: *peer
    command: ["server_example_basic_io"]
    # Published on the loopback only, so that the MMS stack of this repository, run on the host, can
    # reach the reference server (task L6).
    ports:
      - "127.0.0.1:10102:102"
    networks:
      bench:
        ipv4_address: 172.31.102.10

  ref-client:
    <<: *peer
    command: ["sleep", "infinity"]
    networks:
      bench:
        ipv4_address: 172.31.102.21

  # Shares the network namespace of the reference server, so that it sees every frame the server
  # sends and receives. tcpdump writes packet by packet to captures/$BENCH_CAPTURE; the container
  # outlives it so that the helpers can stop it and then run tshark with `exec`.
  capture:
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    network_mode: "service:ref-server"
    depends_on:
      - ref-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      BENCH_CAPTURE: ${BENCH_CAPTURE:-bench.pcap}
    command:
      - sh
      - -c
      - tcpdump -i any -U --immediate-mode -Z root -w "/captures/$$BENCH_CAPTURE" tcp port 102 & exec sleep infinity
    volumes:
      - ./captures:/captures

  # The device under test (task S3): igsmms-server, built as a static binary on the host (bench/README.md)
  # and mounted here, so that the reference client can run its services against this repository's server.
  device:
    image: docker.io/library/debian:bookworm-slim
    command: ["/usr/local/bin/igsmms-server", "--listen", "0.0.0.0:102", "--config", "/etc/igsmms/demo.toml"]
    volumes:
      - ../target/x86_64-unknown-linux-musl/release/igsmms-server:/usr/local/bin/igsmms-server:ro
      - ./device/demo.toml:/etc/igsmms/demo.toml:ro
    ports:
      - "127.0.0.1:10103:102"
    networks:
      bench:
        ipv4_address: 172.31.102.30

  # Shares the network namespace of the device, as `capture` does for the reference server.
  device-capture:
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    network_mode: "service:device"
    depends_on:
      - device
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      BENCH_CAPTURE: ${BENCH_CAPTURE:-bench.pcap}
    command:
      - sh
      - -c
      - tcpdump -i any -U --immediate-mode -Z root -w "/captures/$$BENCH_CAPTURE" tcp port 102 & exec sleep infinity
    volumes:
      - ./captures:/captures

networks:
  bench:
    ipam:
      config:
        - subnet: 172.31.102.0/24
