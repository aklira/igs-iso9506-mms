[package]
name = "igs-iso9506-mms"
version = "0.1.0"
description = "Async MMS client and server over TCP and TLS."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
igs-iso9506-mms-codec = { path = "../igs-iso9506-mms-codec", version = "0.1.0" }
igs-iso9506-mms-link = { path = "../igs-iso9506-mms-link", version = "0.1.0" }
# tokio: the same features as igs-iec104 (task T1, approved by the maintainer); `net` for TCP.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

# clap: the command line of the igsmms-client binary (task T3, MIT or Apache-2.0), derive only.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

# serde and toml: the configuration file of the igsmms-server binary (task S3, MIT or Apache-2.0).
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
# test-util: tokio::time::pause for the fake clock of the loopback tests.
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
# proptest: the property tests of the VMD model (task S1), as in the codec crate.
proptest = { version = "1", default-features = false, features = ["std"] }
